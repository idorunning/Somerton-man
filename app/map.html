<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Somerton Man route research map</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f5f3ee; color: #17202a; }
    header { padding: 1rem 1.25rem; background: #fff; border-bottom: 1px solid #d8d4ca; }
    main { min-height: 70vh; display: grid; place-items: centre; padding: 1.25rem; }
    .notice { max-width: 42rem; background: #fff; padding: 1.25rem; border: 1px solid #d8d4ca; border-radius: .5rem; }
  </style>
</head>
<body>
  <header>
    <strong>Somerton Man route research map</strong>
  </header>
  <main>
    <section class="notice">
      <h1>Map scaffold ready</h1>
      <p>Run <code>python src/build_map.py</code> after adding verified station records. Interactive mapping will be implemented once the data schema and provenance rules are settled.</p>
    </section>
  </main>
</body>
</html>
